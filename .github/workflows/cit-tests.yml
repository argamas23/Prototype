name: CIT Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest-cov pytest-json-report

      - name: Run tests (logs + telemetry + coverage)
        env:
          FIREBASE_PROJECT_ID: test-project
          FIREBASE_STORAGE_BUCKET: test-project.appspot.com
          GOOGLE_APPLICATION_CREDENTIALS: security/test-service-account.json
          ENVIRONMENT: ci
          LOG_LEVEL: INFO
          ALLOWED_ORIGINS: "*"
        run: |
          set -euo pipefail
          mkdir -p artifacts/backend
          cd backend
          python -m pytest -q \
            tests/cit \
            --junitxml=../artifacts/backend/pytest-junit.xml \
            --json-report --json-report-file=../artifacts/backend/pytest-report.json \
            --cov=app --cov-report=xml:../artifacts/backend/coverage.xml --cov-report=term-missing \
            --durations=0 2>&1 | tee ../artifacts/backend/pytest.log

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-artifacts
          path: artifacts/backend
          if-no-files-found: warn

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install coverage provider (no-save)
        working-directory: frontend
        run: npm install --no-save @vitest/coverage-v8

      - name: Run tests (logs + telemetry + coverage)
        run: |
          set -euo pipefail
          mkdir -p artifacts/frontend
          cd frontend
          npx vitest run src/tests/cit \
            --coverage \
            --coverage.provider=v8 \
            --coverage.reportsDirectory=../artifacts/frontend/coverage \
            --coverage.reporter=text \
            --coverage.reporter=json \
            --coverage.reporter=lcov \
            --coverage.reporter=cobertura \
            --reporter=default \
            --reporter=junit \
            --reporter=json \
            --outputFile.junit=../artifacts/frontend/vitest-junit.xml \
            --outputFile.json=../artifacts/frontend/vitest-report.json \
            2>&1 | tee ../artifacts/frontend/vitest.log

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-artifacts
          path: artifacts/frontend
          if-no-files-found: warn
